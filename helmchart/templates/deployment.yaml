apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app-deployment
  labels:
    name: {{ .Release.Name }}
    version: {{ .Values.data.CI_BUILD }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: webapp
    spec:
      imagePullSecrets:
      - name: ghcr-login-secret
      restartPolicy: Always
      containers:
      - name: {{ .Release.Name }}-container
        image: {{ .Values.image.name }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: [ "python", "-m", "streamlit", "run", "--server.port", "{{ .Values.port }}", "/app/chat/app.py" ]
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-configmap
        ports:
        - containerPort: {{ .Values.port }}
          name: {{ .Values.port }}tcp1
          protocol: TCP
