apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-cert
spec:
  secretName: {{ .Release.Name }}-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  commonName: {{ .Values.data.FQDN }}
  dnsNames:
  - {{ .Values.data.FQDN }}
  issuerRef:
    name: {{ .Values.clusterIssuer }}
    kind: ClusterIssuer
